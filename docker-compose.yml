# Local PostgreSQL for development and tests.
#   docker compose up -d
# Then use the URLs from .env.example (port 5432, user/password "snifforbit").
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: snifforbit
      POSTGRES_PASSWORD: snifforbit
      POSTGRES_DB: snifforbit
    ports:
      - "5432:5432"
    volumes:
      - snifforbit-pg:/var/lib/postgresql/data
      - ./scripts/docker-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snifforbit"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  snifforbit-pg:
